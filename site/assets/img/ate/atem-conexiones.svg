<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546E7A"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width:2; rx:10; }
    .label { fill:#ffffff; font-size:13px; font-weight:600; text-anchor:middle; }
    .sub { fill:#ffffff; font-size:10.5px; text-anchor:middle; font-weight:400; }
    .arrow { stroke:#546E7A; stroke-width:2.5; marker-end:url(#arrowA); fill:none; }
    .center { fill:#212121; font-size:16px; font-weight:700; text-anchor:middle; }
  </style>

  <!-- Inputs -->
  <rect class="box" x="10" y="20" width="180" height="60" fill="#1565C0" stroke="#0D47A1"/>
  <text class="label" x="100" y="45">Entrada 1</text>
  <text class="sub" x="100" y="62">Cámara Sony A6600 (HDMI)</text>

  <rect class="box" x="10" y="100" width="180" height="60" fill="#1565C0" stroke="#0D47A1"/>
  <text class="label" x="100" y="125">Entrada 2</text>
  <text class="sub" x="100" y="142">GoPro (HDMI)</text>

  <rect class="box" x="10" y="180" width="180" height="60" fill="#1565C0" stroke="#0D47A1"/>
  <text class="label" x="100" y="205">Entrada 3</text>
  <text class="sub" x="100" y="222">PC / Capturadora AverMedia</text>

  <rect class="box" x="10" y="260" width="180" height="50" fill="#1565C0" stroke="#0D47A1"/>
  <text class="label" x="100" y="288">Entrada 4</text>
  <text class="sub" x="100" y="302" font-size="10">libre / invitados</text>

  <!-- Arrows to center -->
  <line class="arrow" x1="195" y1="50" x2="345" y2="130"/>
  <line class="arrow" x1="195" y1="130" x2="345" y2="150"/>
  <line class="arrow" x1="195" y1="210" x2="345" y2="170"/>
  <line class="arrow" x1="195" y1="285" x2="345" y2="190"/>

  <!-- ATEM box -->
  <rect x="350" y="100" width="200" height="120" rx="12" fill="#37474F" stroke="#102027" stroke-width="2"/>
  <text class="center" x="450" y="150" fill="#ffffff">ATEM</text>
  <text class="center" x="450" y="172" fill="#ffffff">Mini Pro</text>
  <text class="sub" x="450" y="195">conmuta Programa / Preview</text>

  <!-- Outputs -->
  <line class="arrow" x1="555" y1="130" x2="700" y2="60"/>
  <line class="arrow" x1="555" y1="160" x2="700" y2="160"/>
  <line class="arrow" x1="555" y1="190" x2="700" y2="260"/>

  <rect class="box" x="705" y="30" width="185" height="60" fill="#2E7D32" stroke="#1B5E20"/>
  <text class="label" x="797" y="55">Grabación</text>
  <text class="sub" x="797" y="72">disco USB (exFAT)</text>

  <rect class="box" x="705" y="130" width="185" height="60" fill="#EF6C00" stroke="#E65100"/>
  <text class="label" x="797" y="155">Streaming</text>
  <text class="sub" x="797" y="172">directo sin PC</text>

  <rect class="box" x="705" y="230" width="185" height="60" fill="#5E35B1" stroke="#311B92"/>
  <text class="label" x="797" y="255">Monitor</text>
  <text class="sub" x="797" y="272">Multiview / Programa</text>
</svg>
