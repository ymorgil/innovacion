<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowVR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546E7A"/>
    </marker>
  </defs>
  <style>
    .box { fill:#1565C0; stroke:#0D47A1; stroke-width:2; rx:10; }
    .label { fill:#ffffff; font-size:15px; font-weight:600; text-anchor:middle; }
    .num { fill:#ffffff; font-size:12px; text-anchor:middle; opacity:0.85; }
    .arrow { stroke:#546E7A; stroke-width:2.5; marker-end:url(#arrowVR); fill:none; }
  </style>

  <g>
    <rect class="box" x="10" y="70" width="150" height="70"/>
    <text class="num" x="85" y="90">1</text>
    <text class="label" x="85" y="112">Encender gafas</text>
    <text class="label" x="85" y="130" font-size="12" font-weight="400">y configurar Guardian</text>
  </g>

  <line class="arrow" x1="165" y1="105" x2="200" y2="105"/>

  <g>
    <rect class="box" x="205" y="70" width="150" height="70"/>
    <text class="num" x="280" y="90">2</text>
    <text class="label" x="280" y="112">Emparejar</text>
    <text class="label" x="280" y="130" font-size="12" font-weight="400">los mandos</text>
  </g>

  <line class="arrow" x1="360" y1="105" x2="395" y2="105"/>

  <g>
    <rect class="box" x="400" y="70" width="150" height="70"/>
    <text class="num" x="475" y="90">3</text>
    <text class="label" x="475" y="112">Cargar apps</text>
    <text class="label" x="475" y="130" font-size="12" font-weight="400">por Wi-Fi (antes)</text>
  </g>

  <line class="arrow" x1="555" y1="105" x2="590" y2="105"/>

  <g>
    <rect class="box" x="595" y="70" width="150" height="70" fill="#2E7D32" stroke="#1B5E20"/>
    <text class="num" x="670" y="90">4</text>
    <text class="label" x="670" y="112">Sesión con</text>
    <text class="label" x="670" y="130" font-size="12" font-weight="400">alumnado (passthrough)</text>
  </g>

  <text x="450" y="190" text-anchor="middle" font-size="12" fill="#607D8B">Flujo básico de puesta en marcha — Meta Quest 2 (Aula ATECA)</text>
</svg>
