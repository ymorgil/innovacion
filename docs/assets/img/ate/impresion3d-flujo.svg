  <line class="arrow" x1="750" y1="65" x2="785" y2="65"/>

  <rect class="box" x="790" y="30" width="150" height="70" fill="#2E7D32" stroke="#1B5E20"/>
  <text class="label" x="865" y="60">Imprimir</text>
  <text class="sub" x="865" y="78">Artillery / Ultimaker</text>

  <line class="arrow" x1="865" y1="100" x2="865" y2="130"/>
  <line class="arrow" x1="790" y1="165" x2="480" y2="165"/>

  <rect class="box" x="325" y="130" width="150" height="70" fill="#EF6C00" stroke="#E65100"/>
