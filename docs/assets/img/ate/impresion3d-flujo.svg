<svg viewBox="0 0 950 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow3d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546E7A"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width:2; rx:10; }
    .label { fill:#ffffff; font-size:14px; font-weight:600; text-anchor:middle; }
    .sub { fill:#ffffff; font-size:11px; text-anchor:middle; font-weight:400; }
    .arrow { stroke:#546E7A; stroke-width:2.5; marker-end:url(#arrow3d); fill:none; }
