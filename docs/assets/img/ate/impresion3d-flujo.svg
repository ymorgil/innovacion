  <text class="sub" x="85" y="78">TinkerCAD, Fusion 360...</text>

  <line class="arrow" x1="165" y1="65" x2="200" y2="65"/>

  <rect class="box" x="205" y="30" width="150" height="70" fill="#8E24AA" stroke="#4A148C"/>
  <text class="label" x="280" y="60">Escanear objeto</text>
  <text class="sub" x="280" y="78">(opcional) IT3D Scan</text>

  <line class="arrow" x1="360" y1="65" x2="395" y2="65"/>

  <rect class="box" x="400" y="30" width="150" height="70" fill="#6D4C41" stroke="#3E2723"/>
  <text class="label" x="475" y="60">Reparar malla</text>
  <text class="sub" x="475" y="78">rellenar huecos</text>

  <line class="arrow" x1="555" y1="65" x2="590" y2="65"/>

  <rect class="box" x="595" y="30" width="150" height="70" fill="#1565C0" stroke="#0D47A1"/>
  <text class="label" x="670" y="60">Laminar</text>
